{% extends "base.html" %}
{% block title %}Login &middot; EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h3 mb-3">Login</h1>
    {# The form does nothing yet. On Day 6 Flask will check the email and password. #}
    <form method="post" class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" disabled>Login (works on Day 6)</button>
    </form>
    <p class="mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
