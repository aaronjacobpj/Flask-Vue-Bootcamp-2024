{% extends "base.html" %}
{% block title %}Summary &middot; EventHub{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 mb-0">Summary</h1>
  <span class="fs-5">Total revenue: <strong>&#8377;{{ "%.0f" | format(total_revenue) }}</strong></span>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-7">
    <div class="card card-body shadow-sm">
      <h2 class="h6">Seats per event: booked and still free</h2>
      <canvas id="seats-chart"></canvas>
    </div>
  </div>
  <div class="col-12 col-lg-5">
    <div class="card card-body shadow-sm">
      <h2 class="h6">Revenue by venue (&#8377;)</h2>
      <canvas id="revenue-chart"></canvas>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
  // tojson turns Python lists into safe JavaScript arrays.
  const seats = {{ seats_chart | tojson }};
  const revenue = {{ revenue_chart | tojson }};

  drawChart("seats-chart", "bar", seats.labels, [
    { label: "Booked", data: seats.booked, backgroundColor: "#0d6efd" },
    { label: "Left", data: seats.left, backgroundColor: "#ced4da" },
  ], true);
  drawChart("revenue-chart", "doughnut", revenue.labels, [
    { label: "Revenue", data: revenue.values },
  ]);
</script>
{% endblock %}
